<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
</head>
<body>
    <h1>My Expenses</h1>
    <h2>Add expense</h2>
    <form method="post" action="/add">
    <input type="number" step="0.01" name="amount" placeholder="Amount" required>
    <input type="text" name="category" placeholder="Category" required>
    <input type="text" name="description" placeholder="Description" required>
    <input type="date" name="date" min="2000-01-01" max="2100-12-31" required>
    <button type="submit">Add</button>
    </form>
        <table border="1">
        <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Actions</th>
        </tr>
        {% for item in expenses %}
        <tr>
            <td>{{ item.date }}</td>
            <td>{{ item.category }}</td>
            <td>{{ item.description }}</td>
            <td>{{ "%.2f"|format(item.amount) }} {{ currency }}</td>
            <td>
                <a href="/edit/{{ item.id }}">Edit</a>
                <form method="post" action="/delete/{{ item.id }}" onsubmit="return confirm('Delete this expense?')">
                     <button type="submit">Delete</button> 
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>

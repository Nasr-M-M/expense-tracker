<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
</head>
<body>
    <h1>My Expenses</h1>
    <table border="1">
        <tr>
            <th>Date</th>
            <th>Category</th>
            <th>Description</th>
            <th>Amount</th>
        </tr>
        {% for item in expenses %}
        <tr>
            <td>{{ item.date }}</td>
            <td>{{ item.category }}</td>
            <td>{{ item.description }}</td>
            <td>{{ "%.2f"|format(item.amount) }} {{ currency }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
